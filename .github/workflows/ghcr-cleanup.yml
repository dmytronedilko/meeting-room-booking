name: GHCR cleanup

# CI pushes a commit-SHA-tagged backend + frontend image to GHCR on every run, so
# versions accumulate. This prunes old ones weekly (keeping the newest N per image)
# to keep the registry tidy. Runs on a schedule and on demand.
on:
  schedule:
    - cron: '0 4 * * 0' # Sundays, 04:00 UTC
  workflow_dispatch:
    inputs:
      keep:
        description: 'Most-recent versions to keep per image'
        default: '10'

permissions:
  packages: write # delete old package versions

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

jobs:
  prune:
    name: Prune ${{ matrix.suffix }} image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false # attempt both images even if one fails
      matrix:
        suffix: [backend, frontend]
    steps:
      # Derive the GHCR package name from the repo so this works on any fork / new
      # repo: CI pushes images to `ghcr.io/<owner>/<repo>-<suffix>`, so the package
      # to prune is `<repo>-<suffix>`. `$GITHUB_REPOSITORY` (owner/repo) is set on
      # every event, including schedule — strip the owner with `#*/`.
      - id: pkg
        run: echo "name=${GITHUB_REPOSITORY#*/}-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
      - name: Delete old versions of ${{ steps.pkg.outputs.name }}
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: ${{ steps.pkg.outputs.name }}
          package-type: container
          min-versions-to-keep: ${{ github.event.inputs.keep || '10' }}
          # GITHUB_TOKEN works once the package is linked to this repo (the CI build
          # sets the org.opencontainers.image.source label). If a package stays
          # user-scoped, add a PAT secret GHCR_CLEANUP_TOKEN with delete:packages.
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
