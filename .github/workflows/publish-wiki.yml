name: Publish Wiki

# Mirror /docs into the GitHub Wiki whenever the docs (or the publisher itself)
# change on main. The wiki is a separate repo; scripts/publish-wiki.sh clones it,
# copies docs/*.md in, and pushes only if something changed. Run it by hand from
# the Actions tab (workflow_dispatch) for a one-off resync.
#
# Prerequisite (one time): the wiki must exist. Open the repo's Wiki tab and
# save an initial page, otherwise the clone in the script fails with guidance.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/publish-wiki.sh'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

# GITHUB_TOKEN needs write access to push to OWNER/REPO.wiki.git.
permissions:
  contents: write

# Never let two publishes race the wiki repo.
concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish:
    name: Sync /docs → Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Publish
        env:
          WIKI_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
          WIKI_LINK_SLUG: ${{ github.repository }}
          WIKI_LINK_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
        run: sh scripts/publish-wiki.sh
