name: meeting-room-booking

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
    ports:
      # Published for dev mode (`docker compose up db` + `nx serve`).
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-booking}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Explicit image name so CI can pre-build it (Buildx + layer cache) and
    # `docker compose up` reuses it instead of rebuilding. Matches the default
    # `<project>-<service>` tag, so dev behaviour is unchanged.
    image: meeting-room-booking-backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-booking}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_TTL: 24h
      # In Docker the app is reached through the Traefik proxy on :80.
      APP_URL: ${APP_URL:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: '3001'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NOTIFY_BEFORE_MINUTES: ${NOTIFY_BEFORE_MINUTES:-10}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    # Not published to the host: reachable only through the Traefik proxy.
    expose:
      - '3001'
    labels:
      # /api/* → this service. PathPrefix forwards the path unchanged (no strip),
      # so the Nest global prefix `api` still matches. Priority beats the
      # frontend catch-all router below.
      - 'traefik.enable=true'
      - 'traefik.http.routers.backend.rule=PathPrefix(`/api`)'
      - 'traefik.http.routers.backend.entrypoints=web'
      - 'traefik.http.routers.backend.priority=100'
      - 'traefik.http.routers.backend.middlewares=secure-headers@file'
      - 'traefik.http.services.backend.loadbalancer.server.port=3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    # Explicit image name so CI can pre-build it (Buildx + layer cache) and
    # `docker compose up` reuses it instead of rebuilding.
    image: meeting-room-booking-frontend
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Baked into the client bundle: same-origin API via the proxy.
        NEXT_PUBLIC_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - '3000'
    labels:
      # Catch-all: everything that isn't /api/* goes to the Next.js app. Lowest
      # priority so the backend's /api router always wins the overlap.
      - 'traefik.enable=true'
      - 'traefik.http.routers.frontend.rule=PathPrefix(`/`)'
      - 'traefik.http.routers.frontend.entrypoints=web'
      - 'traefik.http.routers.frontend.priority=1'
      - 'traefik.http.routers.frontend.middlewares=secure-headers@file'
      - 'traefik.http.services.frontend.loadbalancer.server.port=3000'

  # Read-only Docker API for Traefik's provider. This sidecar is the only thing
  # that mounts the Docker socket; it exposes just the endpoints Traefik needs
  # (containers + networks, no writes) and sits on an internal-only network, so
  # Traefik never touches the socket itself. See ADR-0020.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      NETWORKS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy

  # The single entry point on :80 (replaces the old nginx `proxy`). Routes are
  # declared as labels on the backend/frontend services above; discovery is via
  # the socket-proxy. Dashboard on 127.0.0.1:8080, metrics on :8082 (internal).
  traefik:
    # v3.7+: the Docker provider negotiates the API version via the proxy's
    # /_ping (older v3.1 defaulted to API 1.24, which Docker Engine 29 rejects —
    # its MinAPIVersion is 1.40).
    image: traefik:v3.7.10
    ports:
      - '80:80'
      # TLS entrypoint — no cert is served until a resolver is enabled in
      # infra/traefik/traefik.yml (templated for a real domain).
      - '443:443'
      # Dashboard, bound to localhost so it is never reachable off-box.
      - '127.0.0.1:8080:8080'
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-acme:/letsencrypt
    networks:
      - default
      - socket-proxy
    depends_on:
      socket-proxy:
        condition: service_started
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - '9090:9090'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_started

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - '3002:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      # Local-only tooling: no auth/TLS, small heap.
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '9200:9200'
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -s http://localhost:9200/_cluster/health | grep -qE ''"status":"(green|yellow)"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - '5601:5601'
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    # Reads other containers' log files, hence root + docker socket.
    user: root
    command: ['--strict.perms=false', '-e']
    volumes:
      - ./infra/elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy

  # One-shot: provisions the Kibana data view for filebeat-* and exits.
  kibana-init:
    image: curlimages/curl:8.10.1
    restart: 'no'
    entrypoint: ['/bin/sh', '/kibana-init.sh']
    volumes:
      - ./infra/elk/kibana-init.sh:/kibana-init.sh:ro
    depends_on:
      kibana:
        condition: service_started

volumes:
  db-data:
  prometheus-data:
  grafana-data:
  es-data:
  filebeat-data:
  traefik-acme:

networks:
  # The implicit app network — every service except the socket-proxy sits here.
  default:
  # Isolates the Docker-socket sidecar together with Traefik. `internal: true`
  # means no route to the outside world, shrinking the blast radius of the one
  # container that can see the Docker socket.
  socket-proxy:
    internal: true
