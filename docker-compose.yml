name: meeting-room-booking

services:
  db:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
    ports:
      # Published for dev mode (`docker compose up db` + `nx serve`).
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-booking}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Explicit image name so CI can pre-build it (Buildx + layer cache) and
    # `docker compose up` reuses it instead of rebuilding. Matches the default
    # `<project>-<service>` tag, so dev behaviour is unchanged.
    image: meeting-room-booking-backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-booking}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_TTL: 24h
      # In Docker the app is reached through the Nginx proxy on :80.
      APP_URL: ${APP_URL:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: '3001'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NOTIFY_BEFORE_MINUTES: ${NOTIFY_BEFORE_MINUTES:-10}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    # Not published to the host: reachable only through the Nginx proxy.
    expose:
      - '3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    # Explicit image name so CI can pre-build it (Buildx + layer cache) and
    # `docker compose up` reuses it instead of rebuilding.
    image: meeting-room-booking-frontend
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Baked into the client bundle: same-origin API via the proxy.
        NEXT_PUBLIC_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - '3000'

  # The single entry point on :80. Routes live in infra/nginx/nginx.conf:
  # /api/* → backend, everything else → the frontend. See ADR-0023.
  nginx:
    image: nginx:1.30.4-alpine
    ports:
      - '80:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      # `wget` is bundled in nginx:alpine (busybox); gates dependents on the edge
      # actually serving.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - '9090:9090'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_started

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - '3002:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      # Local-only tooling: no auth/TLS, small heap.
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '9200:9200'
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -s http://localhost:9200/_cluster/health | grep -qE ''"status":"(green|yellow)"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - '5601:5601'
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    # Reads other containers' log files, hence root + docker socket.
    user: root
    command: ['--strict.perms=false', '-e']
    volumes:
      - ./infra/elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy

  # One-shot: provisions the Kibana data view for filebeat-* and exits.
  kibana-init:
    image: curlimages/curl:8.10.1
    restart: 'no'
    entrypoint: ['/bin/sh', '/kibana-init.sh']
    volumes:
      - ./infra/elk/kibana-init.sh:/kibana-init.sh:ro
    depends_on:
      kibana:
        condition: service_started

volumes:
  db-data:
  prometheus-data:
  grafana-data:
  es-data:
  filebeat-data:
