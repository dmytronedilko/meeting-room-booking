# ── Nginx reverse proxy — the single edge on :80 ─────────────────────────────
# One published app port hides the internal service ports and keeps the app
# same-origin, so the JWT cookie stays first-party and there is no prod CORS.
# `/api/*` → backend (prefix kept, matching the Nest global prefix), everything
# else → the Next.js frontend. See ADR-0023 (which reverted the Traefik edge back
# to a hand-written Nginx config).

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # Don't advertise the exact Nginx version in the `Server` header / error pages —
  # one less hint for an attacker fingerprinting the edge.
  server_tokens off;

  # Static upstreams: the two service names resolve over the Docker network, and
  # compose only starts this proxy after both are up (depends_on). Adding a routed
  # service means editing this file — the trade-off we accepted in ADR-0023.
  upstream backend {
    server backend:3001;
  }

  upstream frontend {
    server frontend:3000;
  }

  server {
    listen 80;
    server_name _;

    # Security headers on every response (`always` = including error responses),
    # ported from the Traefik `secure-headers` middleware so the swap doesn't
    # regress the posture. Conservative and safe over plain HTTP. HSTS stays out
    # until traffic is actually served over TLS — sending it on HTTP is a no-op at
    # best and a foot-gun at worst:
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # REST API (Swagger lives at /api/docs). No trailing path on proxy_pass, so
    # the `/api` prefix is forwarded unchanged and the Nest global prefix matches.
    # The X-Forwarded-* headers back the adapter's `trustProxy` (real client IPs
    # for the throttler and access logs).
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: the Next.js frontend. Upgrade/Connection headers keep
    # WebSocket connections (e.g. dev HMR) working through the proxy.
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  # For a real domain, TLS terminates here: add a `listen 443 ssl;` server with a
  # cert (mount it in, or front this with certbot) and redirect :80 → :443. Nginx
  # has no built-in ACME, which is the capability ADR-0023 consciously traded away.
}
