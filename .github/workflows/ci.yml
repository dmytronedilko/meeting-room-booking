name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. new push to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; individual jobs widen their own scope below.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NX_DAEMON: 'false'
  # Images are built once in Stage 2 and pushed to GHCR under the commit SHA, then
  # pulled by the container scan (Stage 3) and E2E (Stage 5) — no image is built twice.
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend

jobs:
  # ═══ Stage 1 — Sanity & Dependencies (parallel, fail-fast) ═══════════════
  # Everything here duplicates the local git hooks, so a `--no-verify` bypass is
  # still caught. All jobs always run (guarded jobs no-op internally) so the
  # `needs:` DAG below never trips GitHub's skipped-dependency propagation.

  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t lint

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the whole push/PR range is scanned
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for public repos; config (allowlists) read from .gitleaks.toml.

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate commit subjects (Conventional Commits)
        # Only PRs have a well-defined range; step-level guard keeps the job always
        # succeeding on push (so Stage 2 can safely `needs:` it).
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Same rules as the local .githooks/commit-msg (shared script).
          subjects="${RUNNER_TEMP:-/tmp}/commit-subjects.txt"
          git log --no-merges --format=%s "${BASE_SHA}..${HEAD_SHA}" > "$subjects"
          echo "Validating $(wc -l < "$subjects") commit(s) in ${BASE_SHA}..${HEAD_SHA}"
          rc=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            sh scripts/lint-commit-msg.sh "$subject" || rc=1
          done < "$subjects"
          exit $rc
      - name: Not a pull request
        if: github.event_name != 'pull_request'
        run: echo "Push event — commit messages are validated on pull requests."

  snyk_sca:
    name: SCA (Snyk deps)
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Snyk Open Source (SCA) test
        # SCA only — scans package.json/lock dependencies. NOT Snyk Code (SAST).
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          npm install -g snyk
          snyk test --severity-threshold=high
      - name: Skipped (no token)
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "::notice::SNYK_TOKEN not set — skipping Snyk SCA (fork PR or secret missing)."

  # ═══ Stage 2 — Build & Unit Tests (needs all of Stage 1) ════════════════

  build:
    name: Build & push images
    needs: [lint, secrets, commitlint, snyk_sca]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images to GHCR
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend image
        # The Dockerfile compiles the app (nx build) inside, so this covers "build".
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build & push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  unit:
    name: Unit tests + coverage
    needs: [lint, secrets, commitlint, snyk_sca]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Unit tests with coverage
        # CI=true (set by Actions) turns on vitest v8 coverage → coverage/*/lcov.info.
        run: npx nx run-many -t test
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ═══ Stage 3 — Deep Analysis (needs Stage 2; 3 jobs run in parallel) ════

  sonarqube:
    name: Quality (SonarQube)
    needs: [build, unit]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Sonar needs full history for new-code / blame
      - name: Download coverage report
        uses: actions/download-artifact@v7
        with:
          name: coverage
          path: coverage
      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8 # reads sonar-project.properties
      - name: SonarQube Quality Gate
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
      - name: Skipped (no token)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::notice::SONAR_TOKEN not set — skipping SonarQube (fork PR or secret missing)."

  codeql:
    name: SAST (CodeQL)
    needs: [build, unit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

  snyk_container:
    name: Container scan (Snyk)
    needs: [build, unit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull the image from GHCR
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Snyk Container test (backend image)
        # Scans the OS packages + base image of the image built in Stage 2.
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          docker pull "${BACKEND_IMAGE}:${GITHUB_SHA}"
          npm install -g snyk
          snyk container test "${BACKEND_IMAGE}:${GITHUB_SHA}" \
            --file=apps/backend/Dockerfile --severity-threshold=high
      - name: Skipped (no token)
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "::notice::SNYK_TOKEN not set — skipping Snyk Container scan (fork PR or secret missing)."

  # ═══ Stage 4 — Integration Tests (needs ALL of Stage 3) ═════════════════

  integration:
    name: Integration tests (API + Postgres)
    needs: [sonarqube, codeql, snyk_container]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The integration vitest config reads this; its globalSetup runs
      # `prisma migrate deploy` against it before the suite.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_test?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  # ═══ Stage 5 — E2E Tests (needs Integration; reuses Stage 2 images) ═════

  e2e:
    name: E2E (Playwright)
    needs: [integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull the pre-built images from GHCR
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull pre-built images (built once in Stage 2 — no rebuild here)
        run: |
          docker pull "${BACKEND_IMAGE}:${GITHUB_SHA}"
          docker pull "${FRONTEND_IMAGE}:${GITHUB_SHA}"
          # Retag to the names docker-compose.yml expects so `up` reuses them.
          docker tag "${BACKEND_IMAGE}:${GITHUB_SHA}" meeting-room-booking-backend:latest
          docker tag "${FRONTEND_IMAGE}:${GITHUB_SHA}" meeting-room-booking-frontend:latest
      - name: Start the app stack
        # Images are pre-built above; no --build. The backend entrypoint applies
        # migrations + seed; --wait blocks until db and backend are healthy.
        run: docker compose up -d --wait --wait-timeout 180 db backend frontend proxy
      - name: Run e2e tests
        env:
          E2E_BASE_URL: http://localhost
        run: npm run test:e2e
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down -v
