name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Run on a merge queue so a queue (if enabled) never merges an unchecked
  # commit; and allow manual reruns.
  merge_group:
  workflow_dispatch: {}

# Cancel superseded runs on a branch/PR, but NEVER cancel the default branch or
# a tag run — those produce the published images + attestations.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# Least privilege by default; jobs widen their own scope only where needed.
permissions:
  contents: read

env:
  NX_DAEMON: 'false'

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # Everything below runs in parallel from t=0 and blocks merges via branch
  # protection (see docs/Decision-Log.md ADR-0022). The image BUILD no longer
  # waits on the analysis jobs, so the critical path is Build → E2E.
  # `--no-verify` bypasses of the local git hooks are re-checked here.
  # ══════════════════════════════════════════════════════════════════════════

  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-ci
      - run: npx nx run-many -t lint

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history so the whole push/PR range is scanned
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for public repos; allowlists read from .gitleaks.toml.

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate commit subjects (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Same rules as the local .githooks/commit-msg (shared script).
          subjects="${RUNNER_TEMP:-/tmp}/commit-subjects.txt"
          git log --no-merges --format=%s "${BASE_SHA}..${HEAD_SHA}" > "$subjects"
          echo "Validating $(wc -l < "$subjects") commit(s) in ${BASE_SHA}..${HEAD_SHA}"
          rc=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            sh scripts/lint-commit-msg.sh "$subject" || rc=1
          done < "$subjects"
          exit $rc
      - name: Not a pull request
        if: github.event_name != 'pull_request'
        run: echo "Push event — commit messages are validated on pull requests."

  snyk_sca:
    name: SCA (Snyk deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-ci
      - name: Snyk Open Source (SCA)
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          npm install -g snyk
          # Fail only on FIXABLE high/critical (`--fail-on=upgradable`); everything
          # else is reported. A non-vuln error (exit 2/3 — network/API/no manifest)
          # degrades to a warning. SARIF is written regardless of the exit code, for
          # the Security-tab upload below.
          set +e
          snyk test --severity-threshold=high --fail-on=upgradable --sarif-file-output=snyk-sca.sarif
          code=$?
          set -e
          case "$code" in
            0) echo "Snyk SCA: no fixable high/critical issues." ;;
            1) echo "::error::Snyk SCA found fixable high/critical vulnerabilities."; exit 1 ;;
            *) echo "::warning::Snyk SCA did not complete (exit $code — network/API/no-manifest); not failing the build." ;;
          esac
      - name: Upload SCA SARIF
        # Runs even when the scan step failed on a finding (!cancelled()), as long
        # as a SARIF file was produced (skips the degraded-to-warning case).
        if: ${{ !cancelled() && env.SNYK_TOKEN != '' && hashFiles('snyk-sca.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-sca
      # A missing token is legitimate ONLY on a fork PR (GitHub withholds secrets
      # from forks). Anywhere else an empty token means a broken/revoked secret —
      # fail loudly instead of passing a security gate as a silent no-op.
      - name: Skip — no token on a fork PR
        if: ${{ env.SNYK_TOKEN == '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: echo "::notice::SNYK_TOKEN unavailable on a fork PR — skipping Snyk SCA."
      - name: Fail — missing token on a trusted run
        if: ${{ env.SNYK_TOKEN == '' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        run: |
          echo "::error::SNYK_TOKEN is not set on a trusted run (push or same-repo PR). Refusing to pass Snyk SCA as a no-op."
          exit 1

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: apps/backend/Dockerfile
          config: .hadolint.yaml
      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: apps/frontend/Dockerfile
          config: .hadolint.yaml

  iac_scan:
    name: IaC scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Trivy config scan (Dockerfiles + compose)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          # HIGH matters for IaC (permissive networking, root containers, socket
          # mounts). Consciously-accepted findings live in .trivyignore with a
          # justification + expiry — not silenced wholesale.
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore

  license_check:
    name: License check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-ci
      - name: Production dependency licenses
        run: |
          # Report the license spread, then fail on strong-copyleft / SSPL in any
          # production dependency (project is MIT). Version is pinned (not @latest)
          # so CI never executes an unreviewed newer release of this tool.
          npx --yes license-checker-rseidelsohn@5.0.1 --production --summary
          npx --yes license-checker-rseidelsohn@5.0.1 --production \
            --failOn "GPL-1.0;GPL-2.0;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0;GPL-3.0-only;GPL-3.0-or-later;AGPL-1.0;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later;LGPL-2.0;LGPL-2.1;LGPL-3.0;SSPL-1.0"

  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-ci
      - name: Unit tests with coverage
        # CI=true (set by Actions) turns on vitest v8 coverage → coverage/*/lcov.info.
        run: npx nx run-many -t test
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          languages: javascript-typescript
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          category: '/language:javascript-typescript'

  integration:
    name: Integration tests (API + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The integration vitest config reads this; its globalSetup runs
      # `prisma migrate deploy` against it before the suite.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_test?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-ci
      - run: npm run test:integration

  # ── Build (off the analysis critical path) ─────────────────────────────────
  # Build both images locally (no push), generate SBOMs, and export the images
  # as an artifact so the scan / e2e / publish jobs reuse the SAME bits without
  # rebuilding. Nothing is pushed here — see the `publish` job.
  build:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Lowercase image names, computed once here (the root every consumer already
    # `needs`) and passed down as outputs — GHCR rejects an uppercase repo slug.
    outputs:
      backend_image: ${{ steps.imgnames.outputs.backend_image }}
      frontend_image: ${{ steps.imgnames.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compute image names (GHCR requires a lowercase repo slug)
        id: imgnames
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          backend="ghcr.io/${repo}-backend"
          frontend="ghcr.io/${repo}-frontend"
          # For this job's later steps…
          {
            echo "BACKEND_IMAGE=${backend}"
            echo "FRONTEND_IMAGE=${frontend}"
          } >> "$GITHUB_ENV"
          # …and for container_scan / e2e / publish (they read these outputs).
          {
            echo "backend_image=${backend}"
            echo "frontend_image=${frontend}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build backend image (load, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/backend/Dockerfile
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          # Write the cache on main only. PR pushes would each export fresh mode=max
          # buildkit blobs (100s of MB), churning the 10 GB GHA cache and evicting
          # the shared npm cache — which made every node job's `npm ci` go cold.
          # PRs still READ main's cache via cache-from above.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=backend,mode=max' || '' }}
      - name: Build frontend image (load, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          # Back to mode=max: with cache-to gated to main (like backend), PR pushes
          # no longer churn the 10 GB budget, so the earlier mode=min size workaround
          # is unnecessary and max restores full intermediate-stage reuse.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=frontend,mode=max' || '' }}
      - name: SBOM — backend (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-backend.spdx.json
          upload-artifact: false
      - name: SBOM — frontend (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-frontend.spdx.json
          upload-artifact: false
      - name: Export images as an artifact
        # No gzip: `docker save` already tars compressed layers; gzip-then-artifact-zip
        # would be double compression. Save raw and let upload-artifact do ONE zip pass.
        run: docker save "${BACKEND_IMAGE}:${GITHUB_SHA}" "${FRONTEND_IMAGE}:${GITHUB_SHA}" -o images.tar
      - name: Upload images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: images
          path: images.tar
          retention-days: 1
          # Single zip pass at level 6: the artifact is downloaded 3× (container_scan
          # / e2e / publish), so keeping it small beats the raw-tar (level 0) download.
          compression-level: 6
      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sboms
          path: sbom-*.spdx.json
          retention-days: 90

  # ── Scan the built images before they can ever be published ────────────────
  container_scan:
    name: Container scan (Snyk)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download images
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: images
      - name: Load images
        run: docker load < images.tar
      - name: Snyk Container test (backend + frontend)
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          npm install -g snyk
          # Gate on CRITICAL only (ADR-0016). Scan BOTH images, each against its own
          # Dockerfile; a finding in EITHER fails the job. A network/API error on an
          # image degrades to a warning. SARIF is emitted per image for the upload.
          fail=0
          warn=0
          scan() {
            local image="$1" dockerfile="$2" sarif="$3"
            set +e
            snyk container test "$image" --file="$dockerfile" \
              --severity-threshold=critical --sarif-file-output="$sarif"
            local code=$?
            set -e
            case "$code" in
              0) echo "Snyk Container ($image): no critical issues." ;;
              1) echo "::error::Snyk Container found critical vulnerabilities in $image."; fail=1 ;;
              *) echo "::warning::Snyk Container did not complete for $image (exit $code)."; warn=1 ;;
            esac
          }
          scan "${BACKEND_IMAGE}:${GITHUB_SHA}"  apps/backend/Dockerfile  snyk-container-backend.sarif
          scan "${FRONTEND_IMAGE}:${GITHUB_SHA}" apps/frontend/Dockerfile snyk-container-frontend.sarif
          if [ "$fail" -eq 1 ]; then exit 1; fi
          if [ "$warn" -eq 1 ]; then echo "::warning::One or more container scans did not complete (not failing)."; fi
      - name: Upload backend container SARIF
        if: ${{ !cancelled() && env.SNYK_TOKEN != '' && hashFiles('snyk-container-backend.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          sarif_file: snyk-container-backend.sarif
          category: snyk-container-backend
      - name: Upload frontend container SARIF
        if: ${{ !cancelled() && env.SNYK_TOKEN != '' && hashFiles('snyk-container-frontend.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          sarif_file: snyk-container-frontend.sarif
          category: snyk-container-frontend
      - name: Skip — no token on a fork PR
        if: ${{ env.SNYK_TOKEN == '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: echo "::notice::SNYK_TOKEN unavailable on a fork PR — skipping container scan."
      - name: Fail — missing token on a trusted run
        if: ${{ env.SNYK_TOKEN == '' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        run: |
          echo "::error::SNYK_TOKEN is not set on a trusted run (push or same-repo PR). Refusing to pass the container scan as a no-op."
          exit 1

  # ── Quality gate (parallel; PR-only enforcement) ───────────────────────────
  sonarqube:
    name: Quality (SonarQube)
    needs: [unit] # consumes the coverage artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Sonar needs full history for new-code / blame
          persist-credentials: false
      - name: Download coverage report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: coverage
          path: coverage
      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
      - name: SonarQube Quality Gate
        # Enforce on PRs only. The scan above still runs on push to keep the
        # new-code baseline current, but the gate poll 403s on branch analysis
        # with the analysis token — and blocking is moot post-merge (main is PR-only).
        if: ${{ github.event_name == 'pull_request' && env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-quality-gate-action@d304d050d930b02a896b0f85935344f023928496 # v1
        timeout-minutes: 5
      # As with the Snyk gates: empty token/host is legitimate only on a fork PR;
      # anywhere else it means a broken secret — fail rather than silently no-op.
      - name: Skip — no token/host on a fork PR
        if: ${{ (env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: echo "::notice::SONAR_TOKEN/SONAR_HOST_URL unavailable on a fork PR — skipping SonarQube."
      - name: Fail — missing token/host on a trusted run
        if: ${{ (env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '') && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        run: |
          echo "::error::SONAR_TOKEN/SONAR_HOST_URL not fully set on a trusted run. Refusing to pass the quality gate as a no-op."
          exit 1

  # ── E2E (needs the image + integration; NOT the container scan) ────────────
  e2e:
    name: E2E (Playwright)
    needs: [build, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-ci
      - name: Resolve Playwright version
        # Key the browser cache on the installed Playwright version, not the lockfile
        # hash: an unrelated lock change must not evict the browsers, and a Playwright
        # bump with an unchanged lock must MISS (not restore an incompatible cache).
        run: echo "PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_ENV"
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Download images
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: images
      - name: Load + tag images for compose
        run: |
          docker load < images.tar
          docker tag "${BACKEND_IMAGE}:${GITHUB_SHA}" meeting-room-booking-backend:latest
          docker tag "${FRONTEND_IMAGE}:${GITHUB_SHA}" meeting-room-booking-frontend:latest
      - name: Start the app stack
        # Images are loaded above; no --build. The backend entrypoint migrates +
        # seeds; --wait blocks until db, backend, and traefik report healthy.
        run: docker compose up -d --wait --wait-timeout 180 db backend frontend traefik
      - name: Run e2e tests
        env:
          E2E_BASE_URL: http://localhost
        run: npm run test:e2e
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Tear down
        if: always()
        run: docker compose down -v

  # ── Publish (default branch + tags only; never on feature branches/PRs) ────
  # Pushes the SAME scanned images, then attaches provenance + SBOM attestations.
  publish:
    name: Publish images
    # Gate the release on the security jobs too: branch protection does NOT cover
    # push or tag events, so without this a red gitleaks / SCA / license / IaC /
    # SAST run could still ship. codeql is included — it runs on push, can fail,
    # and is shorter than e2e (which we already wait on), so no critical-path cost.
    # sonarqube is deliberately OUT: its quality gate is PR-only (the gate poll
    # 403s on push branch-analysis with the analysis token), so depending on it
    # here would be decorative.
    needs: [build, container_scan, unit, integration, e2e, codeql, secrets, snyk_sca, license_check, iac_scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless signing / attestations via GitHub OIDC
      attestations: write # record the attestations
    env:
      BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download images
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: images
      - name: Download SBOMs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sboms
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag set: always the commit SHA; on a v* tag also the semver version + latest;
      # never latest on main (flavor latest=false + the enable= guard).
      - name: Docker metadata — backend
        id: meta-backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.BACKEND_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      - name: Docker metadata — frontend
        id: meta-frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      - name: Load, tag, and push
        id: push
        env:
          BACKEND_TAGS: ${{ steps.meta-backend.outputs.tags }}
          FRONTEND_TAGS: ${{ steps.meta-frontend.outputs.tags }}
        run: |
          docker load < images.tar
          push_all() {
            local src="$1" tags="$2"
            printf '%s\n' "$tags" | while IFS= read -r t; do
              [ -z "$t" ] && continue
              docker tag "$src" "$t"
              docker push "$t"
            done
          }
          push_all "${BACKEND_IMAGE}:${GITHUB_SHA}"  "$BACKEND_TAGS"
          push_all "${FRONTEND_IMAGE}:${GITHUB_SHA}" "$FRONTEND_TAGS"
          # Digest is content-addressed (identical across every tag). Read it from
          # the registry — not RepoDigests[0], which is order-dependent once an
          # image carries a second repo tag (D3).
          backend_digest="$(docker buildx imagetools inspect "${BACKEND_IMAGE}:${GITHUB_SHA}" --format '{{.Manifest.Digest}}')"
          frontend_digest="$(docker buildx imagetools inspect "${FRONTEND_IMAGE}:${GITHUB_SHA}" --format '{{.Manifest.Digest}}')"
          {
            echo "backend_digest=${backend_digest}"
            echo "frontend_digest=${frontend_digest}"
          } >> "$GITHUB_OUTPUT"
      - name: Attest backend provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.push.outputs.backend_digest }}
          push-to-registry: true
      - name: Attest frontend provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.push.outputs.frontend_digest }}
          push-to-registry: true
      - name: Attest backend SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.push.outputs.backend_digest }}
          sbom-path: sbom-backend.spdx.json
          push-to-registry: true
      - name: Attest frontend SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.push.outputs.frontend_digest }}
          sbom-path: sbom-frontend.spdx.json
          push-to-registry: true
