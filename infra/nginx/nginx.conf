# ── Nginx reverse proxy — the single edge on :80 ─────────────────────────────
# One published app port hides the internal service ports and keeps the app
# same-origin, so the JWT cookie stays first-party and there is no prod CORS.
# `/api/*` → backend (prefix kept, matching the Nest global prefix), everything
# else → the Next.js frontend. See ADR-0010.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # Don't advertise the exact Nginx version in the `Server` header / error pages —
  # one less hint for an attacker fingerprinting the edge.
  server_tokens off;

  # Resolve upstreams via Docker's embedded DNS (127.0.0.11) at request time,
  # re-checking every 10s. A static `upstream {}` block — or any bare hostname in
  # proxy_pass — is resolved once at startup and cached for the life of the
  # process; after `docker compose up` recreates the app containers with new IPs
  # (without also recreating this proxy) nginx keeps hitting the stale IP and
  # every request 502s until it is restarted. A variable in proxy_pass (below) is
  # what forces per-request resolution against this resolver. ipv6=off skips the
  # AAAA lookup — services are IPv4-only on the compose network. Adding a routed
  # service still means editing this file (ADR-0010).
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    # Security headers on every response (`always` = including error responses).
    # Conservative and safe over plain HTTP. HSTS stays out until traffic is
    # actually served over TLS — sending it on HTTP is a no-op at best and a
    # foot-gun at worst:
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # REST API (Swagger lives at /api/docs). No trailing path on proxy_pass, so
    # the `/api` prefix is forwarded unchanged and the Nest global prefix matches.
    # The X-Forwarded-* headers back the adapter's `trustProxy` (real client IPs
    # for the throttler and access logs).
    location /api/ {
      # A variable (not a bare `backend`) makes proxy_pass re-resolve per request
      # via the resolver above instead of pinning one IP at startup.
      set $backend_upstream backend;
      proxy_pass http://$backend_upstream:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: the Next.js frontend. Upgrade/Connection headers keep
    # WebSocket connections (e.g. dev HMR) working through the proxy.
    location / {
      set $frontend_upstream frontend;
      proxy_pass http://$frontend_upstream:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  # For a real domain, TLS terminates here: add a `listen 443 ssl;` server with a
  # cert (mount it in, or front this with certbot) and redirect :80 → :443. Nginx
  # has no built-in ACME, so a real deployment brings its own certificate flow.
}
