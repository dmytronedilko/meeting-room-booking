# ── Traefik v3 static configuration ──────────────────────────────────────────
# The single edge on :80 (it replaced a hand-written Nginx proxy config). Note
# what is NOT here: the routes. They live as labels on the backend/frontend services
# (see the Docker provider below), so adding a service no longer means editing a
# proxy config. See ADR-0020.

global:
  # This is an internal tool image; don't phone home or nag about upgrades.
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ':80'
    http:
      # Pin path sanitization ON (the secure default) so it can't silently flip
      # in a future release. (Traefik v3.7 still logs a benign informational notice
      # about encoded-character handling at startup — harmless for our RFC 3986
      # compliant backend.)
      sanitizePath: true
      # Once a real domain + resolver exist, force HTTPS by uncommenting:
      # redirections:
      #   entryPoint:
      #     to: websecure
      #     scheme: https
  websecure:
    address: ':443'
    http:
      sanitizePath: true
  # Prometheus scrapes metrics here over the Docker network; deliberately NOT
  # published to the host (see docker-compose.yml — no port mapping for :8082).
  metrics:
    address: ':8082'

api:
  dashboard: true
  # insecure = serve the dashboard on the :8080 entrypoint with no auth. Safe
  # only because compose binds it to 127.0.0.1. For a real deployment, drop this
  # and expose the dashboard through a router + auth middleware over TLS.
  insecure: true

# Backs the container healthcheck (`traefik healthcheck --ping`), so compose
# `--wait` and dependents can gate on Traefik actually being ready.
ping: {}

providers:
  docker:
    # Talk to the read-only socket-proxy sidecar, never the raw
    # /var/run/docker.sock — Traefik has no business writing to the Docker API.
    endpoint: 'tcp://socket-proxy:2375'
    # Opt-in routing: a container is only exposed if it sets traefik.enable=true.
    exposedByDefault: false
  file:
    # Reusable middlewares + TLS options that aren't tied to a single service.
    filename: '/etc/traefik/dynamic.yml'
    watch: true

metrics:
  prometheus:
    entryPoint: metrics
    # Per-router/service/entrypoint labels so the Grafana dashboard can break
    # request rate and latency down by backend vs frontend.
    addRoutersLabels: true
    addServicesLabels: true
    addEntryPointsLabels: true

# Structured logs to stdout; Filebeat ships them alongside the app logs.
log:
  level: INFO
accessLog: {}

# ── TLS / Let's Encrypt (templated — enable for a real domain) ────────────────
# Uncomment, set a real email, then add to the web-facing routers:
#   traefik.http.routers.<name>.tls.certresolver=letsencrypt
#   traefik.http.routers.<name>.entrypoints=websecure
# The ACME account/cert is persisted on the `traefik-acme` volume.
# certificatesResolvers:
#   letsencrypt:
#     acme:
#       email: 'ops@example.com'
#       storage: '/letsencrypt/acme.json'
#       httpChallenge:
#         entryPoint: web
