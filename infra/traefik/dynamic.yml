# ── Traefik dynamic configuration (hot-reloaded via provider.file.watch) ─────
# Routers and services come from Docker labels; this file holds the pieces that
# are shared across them — middlewares and TLS options.

http:
  middlewares:
    # Applied to both routers (see the `middlewares=secure-headers@file` labels).
    # Conservative headers that are safe over plain HTTP; HSTS stays commented
    # until traffic is actually served over TLS (sending it on HTTP is a no-op
    # at best and a foot-gun at worst).
    secure-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: 'strict-origin-when-cross-origin'
        # Enable together with the certresolver in traefik.yml:
        # stsSeconds: 31536000
        # stsIncludeSubdomains: true
        # stsPreload: true

# Tighten the negotiated TLS once HTTPS is enabled:
# tls:
#   options:
#     default:
#       minVersion: VersionTLS12
