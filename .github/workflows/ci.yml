name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. new push to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the CodeQL job widens its own scope below.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NX_DAEMON: 'false'

jobs:
  # ── Fast fallback gates ──────────────────────────────────────────────────
  # These duplicate the local pre-commit / commit-msg hooks so a `--no-verify`
  # bypass is still caught here. They run first and in parallel; the expensive
  # jobs below are gated behind `lint` → `unit` so a cheap failure stops the
  # pipeline before it spends minutes on integration/e2e.

  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t lint

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the whole push/PR range is scanned
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for public repos — no GITLEAKS_LICENSE needed.
          # Config (allowlists) is read from .gitleaks.toml automatically.

  commitlint:
    name: Commit messages
    # Only PRs have a well-defined commit range to validate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate commit subjects (Conventional Commits)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Same rules as the local .githooks/commit-msg (shared script).
          subjects="${RUNNER_TEMP:-/tmp}/commit-subjects.txt"
          git log --no-merges --format=%s "${BASE_SHA}..${HEAD_SHA}" > "$subjects"
          echo "Validating $(wc -l < "$subjects") commit(s) in ${BASE_SHA}..${HEAD_SHA}"
          rc=0
          # Read from a file (not a pipe) so rc survives the loop.
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            sh scripts/lint-commit-msg.sh "$subject" || rc=1
          done < "$subjects"
          exit $rc

  # ── Heavy lifting ────────────────────────────────────────────────────────

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t build

  unit:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Unit tests with coverage
        # CI=true (set by GitHub Actions) turns on vitest coverage — see the
        # coverage block in each apps/*/vitest.config.ts and libs/*/vitest.config.ts.
        run: npx nx run-many -t test
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  codeql:
    name: SAST (CodeQL)
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      # JS/TS needs no build step for CodeQL.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

  integration:
    name: Integration tests (API + Postgres)
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The integration vitest config reads this (else defaults to the same URL);
      # its globalSetup runs `prisma migrate deploy` against it before the suite.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_test?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: E2E (Playwright)
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build backend image (GitHub Actions layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          load: true
          tags: meeting-room-booking-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image (GitHub Actions layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          load: true
          tags: meeting-room-booking-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Start the app stack
        # Images are pre-built above (cached); no --build here. Only these four
        # services — observability isn't a dependency. The backend entrypoint
        # applies migrations + seed; --wait blocks until db and backend are healthy.
        run: docker compose up -d --wait --wait-timeout 180 db backend frontend proxy
      - name: Run e2e tests
        env:
          E2E_BASE_URL: http://localhost
        run: npm run test:e2e
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down -v
