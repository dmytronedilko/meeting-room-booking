name: DAST (ZAP baseline)

# Dynamic analysis is deliberately kept OFF the per-PR pipeline (it needs the
# whole app running and is comparatively slow) and runs nightly / on demand
# instead. It boots the real Docker stack — the same way the e2e job does — and
# runs an OWASP ZAP *baseline* (passive) scan against the Nginx proxy.
on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC, nightly
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: ZAP baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build backend image (GitHub Actions layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          load: true
          tags: meeting-room-booking-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image (GitHub Actions layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          load: true
          tags: meeting-room-booking-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Start the app stack
        # Same four services the e2e job uses; the backend entrypoint migrates +
        # seeds; --wait blocks until db and backend report healthy.
        run: docker compose up -d --wait --wait-timeout 180 db backend frontend proxy
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost'
          # Rely on the uploaded report + job status; don't open GitHub issues.
          allow_issue_writing: false
          # -a: include alpha passive rules. Tune findings later via .zap/rules.tsv.
          cmd_options: '-a'
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
