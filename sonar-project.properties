# SonarQube / SonarCloud analysis config, read by the CI "Quality (SonarQube)" job.
# Enforcement requires the SONAR_TOKEN and SONAR_HOST_URL repo secrets; without them
# the job skips (green with a notice). SonarCloud users must also set sonar.organization.

sonar.projectKey=dmytronedilko_meeting-room-booking
# sonar.organization=dmytronedilko          # uncomment and set for SonarCloud

# Analyse app + shared library sources; tests are declared (not measured for coverage).
sonar.sources=apps,libs
sonar.tests=apps,libs
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.exclusions=**/dist/**,**/.next/**,**/node_modules/**,**/*.config.*,**/coverage/**

# Coverage produced by the Unit tests job (vitest v8 → lcov), downloaded as an artifact
# into ./coverage before the scan runs.
sonar.javascript.lcov.reportPaths=coverage/backend/lcov.info,coverage/frontend/lcov.info,coverage/shared/lcov.info

sonar.sourceEncoding=UTF-8
